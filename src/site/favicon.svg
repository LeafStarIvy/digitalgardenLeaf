<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="title desc">
  <title id="title">Electronics Digital Garden</title>
  <desc id="desc">A minimal electronics-inspired mark with a signal arrow passing through a green field and an orange node.</desc>

  <!-- Central field / circuit loop -->
  <path
    d="M330 34
       C345 34 357 49 371 70
       L447 184
       C458 201 458 219 447 236
       L371 350
       C357 371 345 386 330 386
       C315 386 303 371 289 350
       L213 236
       C202 219 202 201 213 184
       L289 70
       C303 49 315 34 330 34Z"
    fill="none"
    stroke="#2E9D4D"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Signal path -->
  <path
    d="M48 335
       C152 306 270 278 383 247
       C456 227 499 209 499 190
       C499 171 458 153 393 135
       C291 107 187 87 103 77"
    fill="none"
    stroke="#191919"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Clean arrowhead, pointing into the node -->
  <path
    d="M103 77 L145 69 M103 77 L137 94"
    fill="none"
    stroke="#191919"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Input / idea node -->
  <circle
    cx="78" cy="77"
    r="34"
    fill="#FFE79A"
    stroke="#F08C00"
    stroke-width="7"/>

  <!-- Small center contact -->
  <circle cx="78" cy="77" r="5" fill="#F08C00"/>
</svg>
